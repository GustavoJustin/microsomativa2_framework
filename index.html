<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - Musica</title>

    <!-- CSS Completo do Bootstrap -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">MoonMusic</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#listas">Listas</a></li>
                        <li class="nav-item"><a class="nav-link" href="#explorar">Explorar</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section id="home">
            <div>
                <h2 class="text-center">Home</h2>
            </div>
        </section>

        <hr class="my-5">

        <section id="listas">
            <div>
                <h2 class="text-center">Listas</h2>
            </div>
        </section>

        <hr class="my-5">

        <section id="explorar">
            <div>
                <h2 class="text-center">Explorar</h2>

                <div class="container mt-5" style="max-width: 500px;">
                    <div class="mb-3">
                        <label for="campoBusca" class="form-label">Digite um nome para filtrar:</label>
                        <input type="text" id="campoBusca" class="form-control" placeholder="Digite para buscar...">
                    </div>

                    <!-- Lista preenchida via JS -->
                    <ul id="listaElementos" class="list-group"></ul>
                </div>
            </div>
        </section>
    </main>

    <div class="d-flex justify-content-end me-3">
        <button id="inicio" class="bg-danger text-white fw-bold rounded border p-2">
            <a href="#" class="nav-link text-white">Voltar para Home</a>
        </button>
    </div>

    <!-- Estrutura do pop-up -->
    <!-- Estrutura do Pop-up (Modal) Estilizado -->
    <div class="modal fade" id="modalMusica" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- Cabeçalho na cor tema (Vermelho) -->
                <div class="modal-header bg-danger text-white border-0">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Carregando...</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>

                <!-- Corpo do Modal -->
                <div class="modal-body text-center p-4">
                    <img id="modalImagem" src="" alt="Capa da música" class="img-fluid rounded-3 mb-3 shadow-sm"
                        style="max-height: 250px; width: 100%; object-fit: cover;">
                    <p id="modalDescricao" class="text-secondary mb-0"></p>
                </div>

                <!-- Rodapé com botão arredondado -->
                <div class="modal-footer border-0 justify-content-center pt-0 pb-4">
                    <button type="button" class="btn btn-danger px-4 rounded-pill fw-semibold"
                        data-bs-dismiss="modal">Fechar</button>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-center text-white mt-5">
        <div class="container py-2">
            <p class="mb-0">&copy; Avaliação Somativa Front-end</p>
        </div>
    </footer>

    <!-- Scripts em ordem correta de dependência -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/pop-up.js"></script>
    <script src="src/js/busca.js"></script>
</body>

</html>
